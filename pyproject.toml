[project]
name = "scry"
version = "0.1.0"
description = "Hybrid semantic and keyword search for Obsidian vaults, served over MCP and a read-only web UI"
readme = "README.md"
authors = [
    { name = "Christoph Stotzer", email = "christoph.stotzer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
scry = "scry.bootstrap:cli_main"
scry-server = "scry.bootstrap:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not models'"
markers = ["models: downloads and runs the real embedding models (run with `-m models`)"]
